{{- $scratch := newScratch }}

{{- if not .Date.IsZero -}}
<span id='published' class='meta-item'>
    发表于 {{ .Date | time.Format (default "January 2, 2006" site.Params.DateFormat) }}

&nbsp;· <span class='meta-item'>更新于 {{ .Params.lastmod | time.Format site.Params.DateFormat }}</span>
{{- end }}
